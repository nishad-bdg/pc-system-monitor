[project]
name = "system-info"
version = "0.1.0"
description = "Report IP address, geolocation and OS info (macOS & Windows)"
readme = "README.md"
authors = [
    { name = "Nishad Islam", email = "nishad.nik@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "psutil>=7.2.2",
    "requests>=2.34.2",
]

[project.scripts]
system-info = "system_info:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]