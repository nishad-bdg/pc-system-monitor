[project]
name = "sysinfo-api"
version = "0.1.0"
description = "FastAPI + MongoDB backend to store system info reports"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "websockets>=15.0",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "pyjwt>=2.10.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
sysinfo-api = "sysinfo_api.main:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
